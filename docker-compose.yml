services:
  remotion-render:
    build: .
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - PORT=4000
      - RENDER_CONCURRENCY=1
      - PUBLIC_BASE_URL=https://render.hispanamur.digital
      - API_TOKEN=${API_TOKEN}
    volumes:
      - remotion-output:/app/output

volumes:
  remotion-output:
